# Site Configuration for Thai-Xuan Nguyen Academic Portfolio
# Adapted from Academic Pages (upstream: https://github.com/academicpages/academicpages.github.io)
# Upstream pinned commit: a4386d88512a52499f4cebff515a1bb9b310da9a

locale                   : "en-US"
site_theme               : "default"
title                    : "Thai-Xuan Nguyen"
title_separator          : "·"
name                     : &name "Nguyen Thai Xuan"
description              : &description "Academic Research Portfolio: Emerging electronic materials, device physics, and scientific instrumentation."
url                      : "https://taixuann.github.io"
baseurl                  : "/academic-portfolio"
repository               : "taixuann/academic-portfolio"

# Site Author Profile
author:
  avatar           : "profile.png"
  name             : "Nguyen Thai Xuan"
  pronouns         : # "he/him"
  bio              : "Emerging electronic materials, device physics, and scientific instrumentation."
  location         : "Hanoi, Vietnam"
  employer         : ""
  uri              : ""
  email            : "tainguyen.materials@gmail.com"

  # Academic profiles
  googlescholar    : ""
  orcid            : ""
  arxiv            : ""
  researchgate     : ""

  # Repositories
  github           : "taixuann"

# Publication Categories
publication_category:
  manuscripts:
    title: 'Preprints & Submitted Manuscripts'
  published:
    title: 'Journal Articles'
  conferences:
    title: 'Conference Papers'

# Site Settings
teaser                   :
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

# Include / Exclude
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - CHANGELOG
  - Capfile
  - config
  - Dockerfile
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - local
  - log
  - node_modules
  - package.json*
  - Rakefile
  - README
  - tmp
  - vendor
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Markdown Engine
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false
  math_engine: mathjax

# Collections
collections:
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true

  # _portfolio
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: false
      comment: false

  # _publications
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comment: false

# Sass
sass:
  sass_dir: _sass
  style: compressed

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
